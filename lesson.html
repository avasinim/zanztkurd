<!doctype html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="index, follow">
  <meta name="description" content="وانەی فێربوونی زمانی کوردی — فۆنێتیک و فۆنۆلۆجی کوردیک">
  <title>وانە | ئاڤاشین</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .lesson-section{margin-top:2rem}.lesson-section h2,.lesson-section h3{margin-bottom:1rem}.lesson-terms{display:grid;gap:.7rem}.lesson-term{display:flex;justify-content:space-between;gap:1rem;padding:.8rem 1rem;border:1px solid rgba(127,127,127,.18);border-radius:12px}.lesson-exercise,.lesson-quiz{margin-top:1rem;padding:1rem;border:1px solid rgba(127,127,127,.18);border-radius:14px}.lesson-exercise textarea{width:100%;min-height:90px;margin-top:.8rem;padding:.8rem;border-radius:10px;border:1px solid rgba(127,127,127,.25);font:inherit;box-sizing:border-box}.lesson-quiz label{display:block;margin:.55rem 0;cursor:pointer}.lesson-actions{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:1.5rem}.lesson-btn{border:0;border-radius:10px;padding:.75rem 1rem;cursor:pointer;font:inherit}.lesson-btn:disabled{cursor:default;opacity:.65}.lesson-result{margin-top:1rem;font-weight:700}.lesson-progress{margin-top:1rem;padding:.8rem 1rem;border-radius:12px;background:rgba(127,127,127,.08)}.lesson-progress-track{height:8px;border-radius:99px;background:rgba(127,127,127,.16);overflow:hidden;margin-top:.65rem}.lesson-progress-bar{height:100%;width:0;background:currentColor;transition:width .25s ease}.lesson-nav{display:flex;justify-content:space-between;gap:1rem;margin-top:2rem;padding-top:1.25rem;border-top:1px solid rgba(127,127,127,.18)}.lesson-nav a{display:inline-flex;flex-direction:column;gap:.25rem;padding:.8rem 1rem;border:1px solid rgba(127,127,127,.18);border-radius:12px;text-decoration:none;max-width:46%}.lesson-nav small{opacity:.7}.lesson-content table{width:100%;border-collapse:collapse;margin:1rem 0}.lesson-content th,.lesson-content td{border:1px solid rgba(127,127,127,.2);padding:.65rem;text-align:right}.lesson-content blockquote{margin:1rem 0;padding:.8rem 1rem;border-right:3px solid currentColor;opacity:.9}.lesson-error{color:#a33}
  </style>
</head>
<body class="content-page">
<header class="header"><nav class="nav container"><a href="index.html" class="brand" aria-label="ئاڤاشین"><span class="brand-mark">ئا</span><span>ئاڤاشین</span></a><div class="nav-links"><a href="learning.html">فێربوونی زمانی کوردی</a><a href="linguistics.html">زمانەوانی کوردی</a><a href="sabir-zhakaw.html">سابیر ژاکاو</a></div><div class="nav-actions"><a class="ghost-btn" href="learning.html">گەڕانەوە</a></div></nav></header>
<main>
  <section class="content-page-hero"><div class="container"><span class="eyebrow" id="lessonEyebrow">وانە</span><h1 id="lessonTitle">چاوەڕوانی...</h1><p id="lessonMeta"></p><div id="lessonProgress" class="lesson-progress" hidden></div></div></section>
  <section class="content-page-body"><div class="container content-page-grid"><article class="content-page-card">
    <div id="lessonContent" class="lesson-content">ناوەڕۆکی وانە لە حالەتی بارکردنە...</div>
    <section id="termsSection" class="lesson-section" hidden><h2>زاراوە گرنگەکان</h2><div id="lessonTerms" class="lesson-terms"></div></section>
    <section id="exercisesSection" class="lesson-section" hidden><h2>تمرینی وانە</h2><div id="lessonExercises"></div></section>
    <section id="quizSection" class="lesson-section" hidden><h2>تاقیکردنەوەی کۆتایی</h2><form id="lessonQuiz"></form><div class="lesson-actions"><button id="checkQuiz" class="lesson-btn" type="button">پشکنینی وەڵامەکان</button></div><div id="quizResult" class="lesson-result" aria-live="polite"></div></section>
    <div id="lessonActions" class="lesson-actions" hidden><button id="completeLesson" class="lesson-btn" type="button">وانەکە تەواو بکە</button></div>
    <nav id="lessonNav" class="lesson-nav" aria-label="ناوبەری وانەکان" hidden></nav>
    <div id="lessonError" class="content-page-note lesson-error" hidden></div>
  </article><aside class="content-page-side"><h3>ئەم وانەیە</h3><div id="lessonObjectives"></div><hr><a href="learning.html">فهرستی فێربوون</a><a href="index.html">پەڕەی سەرەکی</a></aside></div></section>
</main>
<script>
(() => {
  const params=new URLSearchParams(location.search),requestedId=params.get('id')||'phonetics-section-06-lesson-001',catalogUrl='lessons/index.json';
  const $=id=>document.getElementById(id), titleEl=$('lessonTitle'),eyebrowEl=$('lessonEyebrow'),metaEl=$('lessonMeta'),contentEl=$('lessonContent'),objectivesEl=$('lessonObjectives'),errorEl=$('lessonError'),progressEl=$('lessonProgress'),termsSection=$('termsSection'),termsEl=$('lessonTerms'),exercisesSection=$('exercisesSection'),exercisesEl=$('lessonExercises'),quizSection=$('quizSection'),quizEl=$('lessonQuiz'),quizResultEl=$('quizResult'),actionsEl=$('lessonActions'),completeBtn=$('completeLesson'),navEl=$('lessonNav');
  const escapeHtml=v=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const inline=v=>escapeHtml(v).replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');
  function renderMarkdown(md){const lines=md.replace(/\r\n?/g,'\n').split('\n');let html='',inList=false,inTable=false,rows=[];const closeList=()=>{if(inList){html+='</ul>';inList=false}};const closeTable=()=>{if(!inTable)return;if(rows.length){const filtered=rows.filter(r=>!/^\s*\|?\s*:?-+/.test(r.replace(/\|/g,'').trim()));if(filtered.length){html+='<table><tbody>';filtered.forEach((r,i)=>{const cells=r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim());html+=`<tr>${cells.map(c=>i===0?`<th>${inline(c)}</th>`:`<td>${inline(c)}</td>`).join('')}</tr>`});html+='</tbody></table>'}}inTable=false;rows=[]};for(const raw of lines){const line=raw.trim();if(line.startsWith('|')&&line.endsWith('|')){closeList();inTable=true;rows.push(line);continue}if(inTable)closeTable();if(!line){closeList();continue}if(line.startsWith('# ')){closeList();html+=`<h2>${inline(line.slice(2))}</h2>`;continue}if(line.startsWith('## ')){closeList();html+=`<h3>${inline(line.slice(3))}</h3>`;continue}if(line.startsWith('### ')){closeList();html+=`<h4>${inline(line.slice(4))}</h4>`;continue}if(line.startsWith('- ')){if(!inList){html+='<ul>';inList=true}html+=`<li>${inline(line.slice(2))}</li>`;continue}closeList();if(line.startsWith('> ')){html+=`<blockquote>${inline(line.slice(2))}</blockquote>`;continue}html+=`<p>${inline(line)}</p>`}closeList();closeTable();return html}
  function renderTerms(terms){if(!terms?.length)return;termsSection.hidden=false;termsEl.innerHTML=terms.map(i=>{const primary=i.ku??i.kurdish??i.term??'';const secondary=i.en??i.english??'';return `<div class="lesson-term"><strong>${escapeHtml(primary)}</strong><span>${escapeHtml(secondary)}</span></div>`}).join('')}
  function renderExercises(exercises){if(!exercises?.length)return;exercisesSection.hidden=false;exercisesEl.innerHTML=exercises.map((i,n)=>`<div class="lesson-exercise"><strong>${n+1}. ${escapeHtml(i.question)}</strong>${i.type==='classification'&&i.items?.length?`<p>${i.items.map(escapeHtml).join(' · ')}</p>`:''}<textarea name="exercise-${escapeHtml(i.id||n+1)}" placeholder="وەڵامەکەت لێرە بنووسە..."></textarea></div>`).join('')}
  function renderQuiz(quiz){if(!quiz?.length)return;quizSection.hidden=false;quizEl.innerHTML=quiz.map((i,n)=>{const id=i.id||`q-${n+1}`;const correct=Number.isInteger(i.correct)?i.correct:(Number.isInteger(i.answer)?i.answer:null);return `<fieldset class="lesson-quiz"><legend>${n+1}. ${escapeHtml(i.question)}</legend>${(i.options||[]).map((o,j)=>`<label><input type="radio" name="${escapeHtml(id)}" value="${j}" data-correct="${correct}"> ${escapeHtml(o)}</label>`).join('')}</fieldset>`}).join('');$('checkQuiz').onclick=()=>{let correctCount=0,answered=0;quiz.forEach((i,n)=>{const id=i.id||`q-${n+1}`,s=quizEl.querySelector(`input[name="${CSS.escape(id)}"]:checked`);const answer=Number.isInteger(i.correct)?i.correct:(Number.isInteger(i.answer)?i.answer:null);if(s){answered++;if(answer!==null&&Number(s.value)===answer)correctCount++}});const passed=answered===quiz.length&&correctCount===quiz.length;quizResultEl.textContent=`وەڵامدراوە: ${answered} لە ${quiz.length} — ڕاست: ${correctCount} لە ${quiz.length}${passed?' — سەرکەوتوو بوو ✓':''}`;if(passed)markQuizPassed(requestedId)}}
  function markQuizPassed(id){localStorage.setItem(`lesson-quiz:${id}`,'passed');updateProgress(id)}
  function updateProgress(id){const completed=localStorage.getItem(`lesson-progress:${id}`)==='completed',quizPassed=localStorage.getItem(`lesson-quiz:${id}`)==='passed';progressEl.hidden=false;const percent=completed?100:(quizPassed?85:35);progressEl.innerHTML=`<div>${completed?'✓ وانەکە تەواو کراوە':quizPassed?'✓ تاقیکردنەوەکە سەرکەوتوو بوو':'لە حاڵەتی خوێندنەوەدایە'} — ${percent}%</div><div class="lesson-progress-track"><div class="lesson-progress-bar" style="width:${percent}%"></div></div>`;completeBtn.textContent=completed?'✓ وانەکە تەواو کراوە':'وانەکە تەواو بکە';completeBtn.disabled=completed}
  function renderNavigation(section,lessonRef){const lessons=section?.lessons||[],index=lessons.findIndex(l=>l.id===lessonRef.id);if(index<0)return;const prev=lessons[index-1],next=lessons[index+1];navEl.hidden=false;navEl.innerHTML=`${prev?`<a href="lesson.html?id=${encodeURIComponent(prev.id)}"><small>← وانەی پێشوو</small><strong>${escapeHtml(prev.title||'وانە')}</strong></a>`:'<span></span>'}${next?`<a href="lesson.html?id=${encodeURIComponent(next.id)}"><small>وانەی داهاتوو →</small><strong>${escapeHtml(next.title||'وانە')}</strong></a>`:'<span></span>'}`}
  async function getJson(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error(url);return r.json()}async function getText(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error(url);return r.text()}
  async function loadLesson(){try{const catalog=await getJson(catalogUrl);const section=(catalog.sections||[]).find(s=>(s.lessons||[]).some(l=>l.id===requestedId));const lessonRef=section?.lessons?.find(l=>l.id===requestedId);if(!lessonRef)throw Error('lesson-not-found');const data=await getJson(`lessons/${lessonRef.path}`);const contentPath=data.contentPath||lessonRef.contentPath;if(!contentPath)throw Error('content-path-missing');const markdown=await getText(`lessons/${contentPath}`);const lessonNumber=data.number??lessonRef.number;eyebrowEl.textContent=`وانەی ${lessonNumber}`;titleEl.textContent=data.title;metaEl.textContent=`${data.level||'ناوەندی'} · ${data.durationMinutes??data.estimatedMinutes??'—'} خولەک · ${data.source?.author||''}${data.bookLessonNumber||data.source?.bookLessonNumber?` · کتێب: ${data.bookLessonNumber??data.source.bookLessonNumber}`:''}`;contentEl.innerHTML=renderMarkdown(markdown);objectivesEl.innerHTML=`<ul>${(data.objectives||[]).map(i=>`<li>${escapeHtml(i)}</li>`).join('')}</ul>`;renderTerms(data.terms);renderExercises(data.exercises);renderQuiz(data.quiz);actionsEl.hidden=false;updateProgress(data.id||lessonRef.id);completeBtn.onclick=()=>{localStorage.setItem(`lesson-progress:${data.id||lessonRef.id}`,'completed');updateProgress(data.id||lessonRef.id)};renderNavigation(section,lessonRef);document.title=`${data.title} | ئاڤاشین`}catch(e){console.error(e);titleEl.textContent='کێشەیەک لە بارکردنی وانە ڕوویدا';metaEl.textContent='';contentEl.hidden=true;errorEl.hidden=false;errorEl.textContent='ناوەڕۆکی وانەکە نەدۆزرایەوە یان فایلەکانی وانە بە دروستی بار نەبوون.'}}
  loadLesson();
})();
</script>
</body>
</html>
