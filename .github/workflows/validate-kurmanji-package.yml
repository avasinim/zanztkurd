name: Validate Kurmanji course package

on:
  push:
    branches: ["kurmanji-test-config", "kurmanji-clean-release", "fix/kurmanji-ci-current-migration"]
    paths:
      - "kurmanji-course-*.html"
      - "dashboard.html"
      - "learning.html"
      - "lessons/catalog.html"
      - "script.js"
      - "docs/kurmanji-content-seed-part-*.sql"
      - "supabase/migrations/20261024122051_add_kurmanji_courses_and_protected_lessons.sql"
      - "supabase/migrations/20261116120000_reconcile_kurmanji_seed_content.sql"
      - "supabase/migrations/20261118100000_enforce_full_lesson_prefix_progression.sql"
      - "supabase/tests/kurmanji_full_prefix_progression.sql"
      - "supabase/tests/kurmanji_rpc_fixture.sql"
      - "supabase/tests/kurmanji_rpc_integration.sql"
      - "scripts/test_kurmanji_rpc_integration.py"
      - "scripts/test_kurmanji_rpc_integration_runner.py"
      - "scripts/validate_kurmanji_package.py"
      - "scripts/validate_kurmanji_sql.py"
      - "scripts/kurmanji_sql_lexer.py"
      - "scripts/test_kurmanji_sql_lexer.py"
      - "scripts/validate_kurmanji_seed_parity.py"
      - "scripts/test_north_circle_ui.py"
      - "scripts/test_kurmanji_live_test_browser.py"
      - "scripts/test_kurmanji_live_test_browser_guard.py"
      - "docs/KURMANJI-RELEASE-AUDIT.md"
      - "docs/KURMANJI-STUDENT-ACCESS-AUDIT.md"
      - ".github/workflows/validate-kurmanji-package.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "kurmanji-course-*.html"
      - "dashboard.html"
      - "learning.html"
      - "lessons/catalog.html"
      - "script.js"
      - "docs/kurmanji-content-seed-part-*.sql"
      - "supabase/migrations/20261024122051_add_kurmanji_courses_and_protected_lessons.sql"
      - "supabase/migrations/20261116120000_reconcile_kurmanji_seed_content.sql"
      - "supabase/migrations/20261118100000_enforce_full_lesson_prefix_progression.sql"
      - "supabase/tests/kurmanji_full_prefix_progression.sql"
      - "supabase/tests/kurmanji_rpc_fixture.sql"
      - "supabase/tests/kurmanji_rpc_integration.sql"
      - "scripts/test_kurmanji_rpc_integration.py"
      - "scripts/test_kurmanji_rpc_integration_runner.py"
      - "scripts/validate_kurmanji_package.py"
      - "scripts/validate_kurmanji_sql.py"
      - "scripts/kurmanji_sql_lexer.py"
      - "scripts/test_kurmanji_sql_lexer.py"
      - "scripts/validate_kurmanji_seed_parity.py"
      - "scripts/test_north_circle_ui.py"
      - "scripts/test_kurmanji_live_test_browser.py"
      - "scripts/test_kurmanji_live_test_browser_guard.py"
      - "docs/KURMANJI-RELEASE-AUDIT.md"
      - "docs/KURMANJI-STUDENT-ACCESS-AUDIT.md"
      - ".github/workflows/validate-kurmanji-package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kurmanji-package-integrity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kurmanji_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install PostgreSQL SQL parser and integration driver
        run: python -m pip install --upgrade pip pglast "psycopg[binary]==3.3.9"
      - name: Parse Kurmanji migration and seed SQL with PostgreSQL parser
        run: python scripts/validate_kurmanji_sql.py
      - name: Run PostgreSQL SQL lexer unit tests
        run: python -m unittest discover -s scripts -p "test_kurmanji_sql_lexer.py" -v
      - name: Test disposable PostgreSQL runner URL guard
        run: python -m unittest discover -s scripts -p "test_kurmanji_rpc_integration_runner.py" -v
      - name: Run Kurmanji progression RPC integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kurmanji_test
        run: python scripts/test_kurmanji_rpc_integration.py
      - name: Verify exact migration and seed row parity
        run: python scripts/validate_kurmanji_seed_parity.py
      - name: Validate Kurmanji lesson pages and seed keys
        run: python scripts/validate_kurmanji_package.py
      - name: Install Playwright browser tests
        run: |
          python -m pip install --upgrade pip playwright
          python -m playwright install --with-deps chromium
      - name: Run north-circle browser regression tests
        run: python scripts/test_north_circle_ui.py
      - name: Validate isolated Test browser runner configuration
        run: python -m unittest discover -s scripts -p "test_kurmanji_live_test_browser_guard.py" -v
      - name: Compile isolated Test browser runner
        run: python -m py_compile scripts/test_kurmanji_live_test_browser.py
      - name: Safely verify Test credentials configuration (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        env:
          TEST_URL: ${{ secrets.AVASIN_TEST_SUPABASE_URL }}
          TEST_KEY: ${{ secrets.AVASIN_TEST_SUPABASE_PUBLISHABLE_KEY }}
          TEST_EMAIL: ${{ secrets.AVASIN_TEST_STUDENT_EMAIL }}
          TEST_PASSWORD: ${{ secrets.AVASIN_TEST_STUDENT_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          import sys

          checks = {
              "All four Test secrets are present": all(os.getenv(name) for name in ("TEST_URL", "TEST_KEY", "TEST_EMAIL", "TEST_PASSWORD")),
              "URL matches the approved Test project": os.getenv("TEST_URL", "").rstrip("/") == "https://juwsjljbdwyncicybwoq.supabase.co",
              "Publishable key has the expected prefix": os.getenv("TEST_KEY", "").startswith("sb_publishable_"),
              "Student email has no surrounding whitespace": os.getenv("TEST_EMAIL", "") == os.getenv("TEST_EMAIL", "").strip(),
          }
          for label, passed in checks.items():
              print(f"{'PASS' if passed else 'FAIL'}: {label}")
          sys.exit(0 if all(checks.values()) else 1)
          PY
      # Real Test access is opt-in: only a manual dispatch can use these secrets.
      # The runner fails closed unless the exact Test project and a pre-enrolled
      # Test learner are supplied; it blocks all non-allowlisted database writes.
      - name: Run read-only isolated Test browser smoke test (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        env:
          AVASIN_TEST_SUPABASE_URL: ${{ secrets.AVASIN_TEST_SUPABASE_URL }}
          AVASIN_TEST_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.AVASIN_TEST_SUPABASE_PUBLISHABLE_KEY }}
          AVASIN_TEST_STUDENT_EMAIL: ${{ secrets.AVASIN_TEST_STUDENT_EMAIL }}
          AVASIN_TEST_STUDENT_PASSWORD: ${{ secrets.AVASIN_TEST_STUDENT_PASSWORD }}
        run: python scripts/test_kurmanji_live_test_browser.py
