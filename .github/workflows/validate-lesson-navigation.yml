name: Validate lesson navigation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate lessons 1–19 navigation
        run: python scripts/validate_lesson_navigation.py
