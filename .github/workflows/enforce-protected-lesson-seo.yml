name: Enforce protected lesson SEO

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  enforce-noindex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set noindex on protected lessons
        shell: python
        run: |
          from pathlib import Path
          import re

          paths = list(Path("lessons").glob("[0-9][0-9][0-9].html"))
          paths += list(Path("lessons").glob("course-2-*.html"))

          for path in paths:
              text = path.read_text(encoding="utf-8")
              updated, count = re.subn(
                  r'<meta\s+name=["\']robots["\'][^>]*>',
                  '<meta name="robots" content="noindex,follow">',
                  text,
                  count=1,
                  flags=re.I,
              )
              if count == 0:
                  updated = re.sub(
                      r'(<head[^>]*>)',
                      r'\1\n  <meta name="robots" content="noindex,follow">',
                      text,
                      count=1,
                      flags=re.I,
                  )
              if updated != text:
                  path.write_text(updated, encoding="utf-8")

      - name: Commit SEO corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lessons/*.html
          if git diff --cached --quiet; then
            echo "No lesson SEO changes needed."
            exit 0
          fi
          git commit -m "seo: mark protected lessons noindex"
          git push
