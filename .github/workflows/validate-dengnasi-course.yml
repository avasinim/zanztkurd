name: Validate Kurmanji Dengnasi course
on:
  pull_request:
    paths:
      - "Dengnasiya_Zimane_Kurdi_27_Wane.pdf"
      - "Dengnasiya_Zimane_Kurdi_27_Wane_corrected.pdf"
      - "docs/kurmanji-dengnasi-course.json"
      - "kurmanji-dengnasi-course.html"
      - "kurmanji-dengnasi-reader.html"
      - "scripts/validate_kurmanji_dengnasi_course.py"
      - "scripts/generate_dengnasi_previews.py"
      - "docs/KURMANJI-DENGNASI-LESSON-AUTHORING.md"
      - "docs/previews/kurmanji-dengnasi-lesson-*-content-preview.html"
      - "scripts/check_public_dengnasi_pdf.py"
      - "scripts/test_dengnasi_lesson_browser.py"
      - "docs/previews/dengnasi-content-html-payload-preview.json"
      - "lessons/kurmanji-dengnasi-lesson-*.html"
      - "script.js"
      - ".github/workflows/validate-dengnasi-course.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-course-map:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install PDF integrity checker
        run: python -m pip install pypdf
      - name: Verify generated lesson previews match current authoring source
        run: python scripts/generate_dengnasi_previews.py --check
      - name: Validate 27-lesson course map, PDF integrity, and reader routes
        run: python scripts/validate_kurmanji_dengnasi_course.py
      - name: Verify public PDF delivery, checksum, and page count
        run: python scripts/check_public_dengnasi_pdf.py
      - name: Install Playwright browser tests
        run: |
          python -m pip install --upgrade pip playwright
          python -m playwright install --with-deps chromium
      - name: Test all 27 Dengnasi lesson pages and access gates with mocked Supabase
        run: python scripts/test_dengnasi_lesson_browser.py
