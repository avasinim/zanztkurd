name: Validate Kurmanji Dengnasi course
on:
  pull_request:
    paths:
      - "Dengnasiya_Zimane_Kurdi_27_Wane.pdf"
      - "Dengnasiya_Zimane_Kurdi_27_Wane_corrected.pdf"
      - "docs/kurmanji-dengnasi-course.json"
      - "kurmanji-dengnasi-course.html"
      - "kurmanji-dengnasi-reader.html"
      - "scripts/validate_kurmanji_dengnasi_course.py"
      - "scripts/generate_dengnasi_previews.py"
      - "docs/KURMANJI-DENGNASI-LESSON-AUTHORING.md"
      - "docs/previews/kurmanji-dengnasi-lesson-*-content-preview.html"
      - "scripts/check_public_dengnasi_pdf.py"
      - "scripts/test_dengnasi_lesson_browser.py"
      - "docs/previews/dengnasi-content-html-payload-preview.json"
      - "lessons/kurmanji-dengnasi-lesson-*.html"
      - "script.js"
      - ".github/workflows/validate-dengnasi-course.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-course-map:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install PDF integrity checker
        run: python -m pip install pypdf
      - name: Regenerate and verify lesson previews from current source
        run: |
          python scripts/generate_dengnasi_previews.py --write
          python scripts/generate_dengnasi_previews.py --check
      - name: Upload regenerated previews for review
        uses: actions/upload-artifact@v4
        with:
          name: dengnasi-source-audit-01-07-previews
          path: |
            docs/previews/kurmanji-dengnasi-lesson-*-content-preview.html
            docs/previews/dengnasi-content-html-payload-preview.json
          if-no-files-found: error
      - name: Validate 27-lesson course map, PDF integrity, and reader routes
        run: python scripts/validate_kurmanji_dengnasi_course.py
      - name: Verify public PDF delivery, checksum, and page count
        run: python scripts/check_public_dengnasi_pdf.py
      - name: Install Playwright browser tests
        run: |
          python -m pip install --upgrade pip playwright
          python -m playwright install --with-deps chromium
      - name: Test all 27 Dengnasi lesson pages and access gates with mocked Supabase
        run: python scripts/test_dengnasi_lesson_browser.py

      - name: Sync regenerated previews to isolated implementation branch after all checks pass
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'implementation/dengnasi-content-html-bridge-2026-11-26' && github.event.pull_request.head.ref == 'test/dengnasi-source-audit-01-02-2026-11-26'
        env:
          TARGET_BRANCH: implementation/dengnasi-content-html-bridge-2026-11-26
        run: |
          git fetch origin "$TARGET_BRANCH"
          git worktree add /tmp/dengnasi-target "origin/$TARGET_BRANCH"
          mkdir -p /tmp/dengnasi-target/docs/previews
          cp docs/previews/kurmanji-dengnasi-lesson-*-content-preview.html /tmp/dengnasi-target/docs/previews/
          cp docs/previews/dengnasi-content-html-payload-preview.json /tmp/dengnasi-target/docs/previews/
          cd /tmp/dengnasi-target
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/previews/kurmanji-dengnasi-lesson-*-content-preview.html docs/previews/dengnasi-content-html-payload-preview.json
          if git diff --cached --quiet; then
            echo "Generated previews already match the implementation branch."
          else
            git commit -m "Refresh generated Dengnasi previews after Lessons 1-2 source audit"
            git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          fi
