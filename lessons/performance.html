<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="ڕاپۆرتی ئەدا و پێشکەوتنی فێربوونی زمانی کوردی لە ئاڤاشین.">
<title>ڕاپۆرتی ئەدا و پێشکەوتن | ئاڤاشین</title>
<link rel="stylesheet" href="../style.css">
<style>
.performance-body{padding:52px 0 80px}.performance-card{border:1px solid rgba(255,255,255,.1);border-radius:24px;background:rgba(255,255,255,.035);padding:26px}.performance-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:26px}.performance-stat{padding:20px;border:1px solid rgba(255,255,255,.09);border-radius:18px;background:rgba(255,255,255,.025);text-align:center}.performance-stat strong{display:block;font-size:1.8rem;margin-bottom:5px}.performance-stat span{opacity:.7;font-size:.9rem}.overall-bar{height:10px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;margin:14px 0 28px}.overall-bar span{display:block;height:100%;background:currentColor;border-radius:inherit;transition:width .3s ease}.report-list{display:grid;gap:12px}.report-row{padding:18px;border:1px solid rgba(255,255,255,.08);border-radius:17px;background:rgba(255,255,255,.025);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.report-row strong{font-size:1rem}.report-row small{opacity:.7}.report-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}.report-empty{padding:25px;border-radius:18px;background:rgba(255,255,255,.035);opacity:.8;text-align:center}.danger-btn{border:1px solid rgba(255,255,255,.14);background:transparent;color:inherit;cursor:pointer;font:inherit;border-radius:14px;padding:11px 17px}.danger-btn:hover{background:rgba(255,255,255,.06)}
</style>
</head>
<body class="content-page">
<header class="header"><nav class="nav container"><a href="../index.html" class="brand" aria-label="ئاڤاشین"><span class="brand-mark">ئا</span><span>ئاڤاشین</span></a><div class="nav-links"><a href="../learning.html">فێربوونی زمانی کوردی</a><a href="../linguistics.html">زمانەوانی کوردی</a><a href="../sabir-zhakaw.html">سابیر ژاکاو</a><a href="../index.html#books">کتێبەکان</a></div><div class="nav-actions"><a class="ghost-btn" href="../learning.html">گەڕانەوە</a></div></nav></header>
<main>
<section class="content-page-hero"><div class="container"><span class="eyebrow">ئەدا و پێشکەوتن</span><h1>ڕاپۆرتی فێربوون</h1><p id="summary">چاوەڕوانی...</p><div class="report-actions"><a class="ghost-btn" href="catalog.html">فهرستی وانەکان</a><a class="ghost-btn" href="../learning.html">ڕێڕەوی فێربوون</a></div></div></section>
<section class="performance-body"><div class="container"><article class="performance-card"><div id="stats" class="performance-stats"></div><div id="bar" class="overall-bar" aria-label="نرخی پێشکەوتن"><span style="width:0%"></span></div><div id="report" class="report-list"></div><div class="report-actions"><button class="danger-btn" id="reset" type="button">سڕینەوەی پێشکەوتن</button></div></article></div></section>
</main><footer class="footer"><div class="container footer-bottom">© ٢٠٢٦ ئاڤاشین · فێربوونی زمانی کوردی</div></footer>
<script>
(async()=>{const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const done=l=>localStorage.getItem(`lesson-completed:${l.id}`)==='true'||localStorage.getItem(`lesson-progress:${l.id}`)==='completed';try{const res=await fetch('index.json',{cache:'no-store'});if(!res.ok)throw Error('catalog');const data=await res.json(),lessons=(data.sections||[]).flatMap(s=>(s.lessons||[]).map(l=>({...l,sectionTitle:s.title}))),completed=lessons.filter(done).length,passed=lessons.filter(l=>localStorage.getItem(`lesson-quiz:${l.id}`)==='passed').length,total=lessons.length,pct=total?Math.round(completed/total*100):0;document.getElementById('summary').textContent=`${completed} لە ${total} وانە تەواو کراوە — ${passed} تاقیکردنەوە سەرکەوتوو — ${pct}% پێشکەوتن`;document.getElementById('bar').firstElementChild.style.width=pct+'%';document.getElementById('stats').innerHTML=`<div class="performance-stat"><strong>${total}</strong><span>کۆی وانەکان</span></div><div class="performance-stat"><strong>${completed}</strong><span>وانەی تەواوکراو</span></div><div class="performance-stat"><strong>${passed}</strong><span>تاقیکردنەوەی سەرکەوتوو</span></div><div class="performance-stat"><strong>${pct}%</strong><span>پێشکەوتنی گشتی</span></div>`;document.getElementById('report').innerHTML=lessons.map(l=>{const d=done(l),q=localStorage.getItem(`lesson-quiz:${l.id}`)==='passed';return `<div class="report-row"><div><strong>${esc(l.number)}. ${esc(l.title)}</strong><br><small>${esc(l.sectionTitle||'')}</small></div><div><small>${d?'✓ وانە تەواو':q?'✓ تاقیکردنەوە سەرکەوتوو':'لە دەستپێکدا'}</small></div></div>`}).join('')||'<div class="report-empty">هیچ وانەیەک نییە.</div>'}catch(e){document.getElementById('summary').textContent='بارکردنی ڕاپۆرت سەرکەوتوو نەبوو.';document.getElementById('report').innerHTML='<div class="report-empty">تکایە دووبارە هەوڵ بدە.</div>'}document.getElementById('reset').onclick=()=>{if(confirm('دڵنیایت دەتەوێت هەموو پێشکەوتنەکان بسڕیتەوە؟')){Object.keys(localStorage).filter(k=>k.startsWith('lesson-')).forEach(k=>localStorage.removeItem(k));location.reload()}}})();
</script></body></html>
