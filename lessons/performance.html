<!doctype html>
<html lang="ckb" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ڕاپۆرتی ئەدا | ئاڤاشین</title><link rel="stylesheet" href="../style.css"></head>
<body class="content-page"><main><section class="content-page-hero"><div class="container"><span class="eyebrow">ئەدا و پێشکەوتن</span><h1>ڕاپۆرتی فێربوون</h1><p id="summary">چاوەڕوانی...</p></div></section><section class="content-page-body"><div class="container"><article class="content-page-card"><div id="report"></div><div class="lesson-actions"><a class="lesson-btn" href="../learning.html">گەڕانەوە بۆ وانەکان</a><button class="lesson-btn" id="reset" type="button">سڕینەوەی پێشکەوتن</button></div></article></div></section></main><script>
(async()=>{const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const catalog=await fetch('index.json',{cache:'no-store'}).then(r=>r.json());const lessons=(catalog.sections||[]).flatMap(s=>s.lessons||[]);let completed=0,passed=0;const rows=lessons.map(l=>{const done=localStorage.getItem(`lesson-progress:${l.id}`)==='completed',quiz=localStorage.getItem(`lesson-quiz:${l.id}`)==='passed';if(done)completed++;if(quiz)passed++;return `<div class="lesson-progress"><strong>${esc(l.number)}. ${esc(l.title)}</strong><div>${done?'✓ وانە تەواو':'—'} · ${quiz?'✓ تاقیکردنەوە سەرکەوتوو':'تاقیکردنەوە نەکراوە'}</div></div>`});const total=lessons.length,pct=total?Math.round(completed*100/total):0;document.getElementById('summary').textContent=`${completed} لە ${total} وانە تەواو کراوە — ${passed} تاقیکردنەوە سەرکەوتوو — ${pct}% پێشکەوتن`;document.getElementById('report').innerHTML=rows.join('')||'<p>هیچ وانەیەک نییە.</p>';document.getElementById('reset').onclick=()=>{if(confirm('دڵنیایت دەتەوێت هەموو پێشکەوتنەکان بسڕیتەوە؟')){Object.keys(localStorage).filter(k=>k.startsWith('lesson-')).forEach(k=>localStorage.removeItem(k));location.reload()}}})();
</script></body></html>
