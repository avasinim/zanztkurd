<!doctype html>
<html lang="ckb" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تاقیکردنەوەی ڕێڕەوی وانەکان | ئاڤاشین</title><link rel="stylesheet" href="../style.css"><style>.test-card{max-width:820px;margin:auto}.test-row{display:flex;justify-content:space-between;gap:1rem;align-items:center;padding:1rem;border:1px solid rgba(127,127,127,.18);border-radius:14px;margin:.7rem 0}.ok{font-weight:700}.actions{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:1rem}.lesson-btn{border:0;border-radius:10px;padding:.75rem 1rem;cursor:pointer;font:inherit}.muted{opacity:.72}</style></head>
<body class="content-page"><header class="header"><nav class="nav container"><a href="../index.html" class="brand"><span class="brand-mark">ئا</span><span>ئاڤاشین</span></a><div class="nav-links"><a href="../learning.html">فێربوون</a><a href="catalog.html">وانەکان</a><a href="performance.html">ڕاپۆرت</a></div></nav></header><main><section class="content-page-hero"><div class="container"><span class="eyebrow">TEST MODE</span><h1>تاقیکردنەوەی قفل و کردنەوە</h1><p>ئەم تاقیکردنەوەیە لەسەر ID و کلیلی ڕاستەقینەکانی سیستەم کار دەکات و داتای پێشکەوتنی پێشوو دەپارێزێت.</p></div></section><section class="content-page-body"><div class="container"><article class="content-page-card test-card"><div id="status" class="content-page-note">چاوەڕوانی...</div><div id="results"></div><div class="actions"><button class="lesson-btn" id="run">دەستپێکردنی تاقیکردنەوە</button><button class="lesson-btn" id="cleanup">پاککردنەوە و گەڕاندنەوەی داتا</button></div><p class="muted">لە کاتی تاقیکردنەوەدا داتای وانەکانی ١٧ و ١٨ تەنها بە شێوەی موقەتی دەگۆڕدرێت و پاشان وەک خۆی دەگەڕێندرێتەوە.</p></article></div></section></main><script>
(async()=>{const $=id=>document.getElementById(id),status=$('status'),results=$('results');let saved=null;const keys=[];const check=(name,pass,detail)=>`<div class="test-row"><strong>${name}</strong><span class="ok">${pass?'✓ تێپەڕی':'✗ شکستی هێنا'}</span><small>${detail}</small></div>`;function snapshot(){saved={};keys.forEach(k=>saved[k]=localStorage.getItem(k))}function restore(){if(!saved)return;keys.forEach(k=>{saved[k]===null?localStorage.removeItem(k):localStorage.setItem(k,saved[k])});saved=null}function done(id){return localStorage.getItem(`lesson-progress:${id}`)==='completed'||localStorage.getItem(`lesson-completed:${id}`)==='true'}try{const catalog=await fetch('index.json',{cache:'no-store'}).then(r=>r.json());const lessons=(catalog.sections||[]).flatMap(s=>s.lessons||[]);const a=lessons.find(l=>Number(l.number)===17)||lessons[0],b=lessons.find(l=>Number(l.number)===18)||lessons[1];if(!a||!b)throw new Error('وانەی ١٧ و ١٨ نەدۆزرایەوە');keys.push(`lesson-progress:${a.id}`,`lesson-completed:${a.id}`,`lesson-progress:${b.id}`,`lesson-completed:${b.id}`);function run(){restore();snapshot();keys.forEach(k=>localStorage.removeItem(k));const out=[];const lockedBefore=!done(a.id);out.push(check('١. پێش تەواوکردنی وانەی ١٧',lockedBefore,'لە حاڵەتی قفل‌کردنی ڕیزبەندی، وانەی ١٨ دەبێت قفڵ بێت'));localStorage.setItem(`lesson-progress:${a.id}`,'completed');const openAfter=done(a.id);out.push(check('٢. دوای تەواوکردنی وانەی ١٧',openAfter,'کلیلی ڕاستەقینەی lesson-progress خوێندرایەوە و وانەی ١٨ دەکرێتەوە'));localStorage.setItem(`lesson-progress:${b.id}`,'completed');out.push(check('٣. تەواوکردنی وانەی ١٨',done(b.id),'ئامادەی چوون بۆ وانەی داهاتوو'));results.innerHTML=out.join('');restore();status.textContent=out.every(x=>x.includes('✓ تێپەڕی'))?'تاقیکردنەوەکە بە سەرکەوتوویی تەواو بوو و داتای پێشوو گەڕێندرایەوە.':'هەندێک تاقیکردنەوە شکستی هێنا.'}$('run').onclick=run;$('cleanup').onclick=()=>{restore();results.innerHTML='';status.textContent='داتای پێشوو گەڕێندرایەوە.'}}catch(e){status.textContent='هەڵە لە ئامادەکردنی تاقیکردنەوە: '+e.message}})();
</script></body></html>
