<!doctype html>
<html lang="ckb" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تاقیکردنەوەی ڕێڕەوی وانەکان | ئاڤاشین</title><link rel="stylesheet" href="../style.css"><style>.test-card{max-width:820px;margin:auto}.test-row{display:flex;justify-content:space-between;gap:1rem;align-items:center;padding:1rem;border:1px solid rgba(127,127,127,.18);border-radius:14px;margin:.7rem 0}.ok{font-weight:700}.actions{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:1rem}.lesson-btn{border:0;border-radius:10px;padding:.75rem 1rem;cursor:pointer;font:inherit}.muted{opacity:.72}</style></head>
<body class="content-page"><header class="header"><nav class="nav container"><a href="../index.html" class="brand"><span class="brand-mark">ئا</span><span>ئاڤاشین</span></a><div class="nav-links"><a href="../learning.html">فێربوون</a><a href="catalog.html">وانەکان</a><a href="performance.html">ڕاپۆرت</a></div></nav></header><main><section class="content-page-hero"><div class="container"><span class="eyebrow">TEST MODE</span><h1>تاقیکردنەوەی قفل و کردنەوە</h1><p>ئەم پەڕەیە تەنها بۆ پشکنینی منطقە و هیچ ڕێڕەوی فێربوونی بەکارهێنەر ناگۆڕێت.</p></div></section><section class="content-page-body"><div class="container"><article class="content-page-card test-card"><div id="status" class="content-page-note">چاوەڕوانی...</div><div id="results"></div><div class="actions"><button class="lesson-btn" id="run">دەستپێکردنی تاقیکردنەوە</button><button class="lesson-btn" id="cleanup">پاککردنەوەی تاقیکردنەوە</button></div><p class="muted">تاقیکردنەوە تەنها دوو کلیلی موقەتی localStorage دروست دەکات و لە کۆتاییدا هەموویان دەسڕێتەوە.</p></article></div></section></main><script>
(async()=>{const $=id=>document.getElementById(id), status=$('status'),results=$('results');const testA='__progression_test_017',testB='__progression_test_018';const check=(name,pass,detail)=>`<div class="test-row"><strong>${name}</strong><span class="ok">${pass?'✓ تێپەڕی':'✗ شکستی هێنا'}</span><small>${detail}</small></div>`;function clean(){localStorage.removeItem(testA);localStorage.removeItem(testB)}function run(){clean();let out=[];let aDone=localStorage.getItem(testA)==='completed';out.push(check('١. پێش تەواوکردنی وانەی ١٧',!aDone,'وانەی ١٨ دەبێت قفڵ بێت'));localStorage.setItem(testA,'completed');aDone=localStorage.getItem(testA)==='completed';let bOpen=aDone;out.push(check('٢. دوای تەواوکردنی وانەی ١٧',bOpen,'وانەی ١٨ دەبێت بکرێتەوە'));localStorage.setItem(testB,'completed');let bDone=localStorage.getItem(testB)==='completed';out.push(check('٣. تەواوکردنی وانەی ١٨',bDone,'دەتوانرێت بۆ وانەی داهاتوو بڕۆیت'));results.innerHTML=out.join('');status.textContent=out.every(x=>x.includes('✓ تێپەڕی'))?'تاقیکردنەوەکە بە سەرکەوتوویی تەواو بوو.':'هەندێک تاقیکردنەوە شکستی هێنا.';clean()}$('run').onclick=run;$('cleanup').onclick=()=>{clean();results.innerHTML='';status.textContent='داتای تاقیکردنەوە پاک کرایەوە.'}})();
</script></body></html>
