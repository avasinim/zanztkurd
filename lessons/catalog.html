<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="فهرستی ڕێکخراوی وانەکانی فۆنێتیک و فۆنۆلۆجی کوردیک لە ئاڤاشین.">
<title>وانەکانی فۆنێتیک و فۆنۆلۆجی کوردیک | ئاڤاشین</title>
<link rel="stylesheet" href="../style.css">
<style>
.lesson-catalog{padding:52px 0 80px}.catalog-tools{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:26px}.catalog-tools input,.catalog-tools select{background:rgba(255,255,255,.04);color:inherit;border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:13px 16px;outline:0;font:inherit}.catalog-tools input{flex:1;min-width:240px}.catalog-tools select{min-width:210px}.catalog-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px}.catalog-card{display:flex;flex-direction:column;gap:12px;padding:22px;border:1px solid rgba(255,255,255,.1);border-radius:20px;background:rgba(255,255,255,.035);min-height:235px}.catalog-card h2{margin:0;font-size:1.18rem}.catalog-card p{margin:0;opacity:.75;line-height:1.8}.catalog-meta{display:flex;gap:9px;flex-wrap:wrap;font-size:.84rem;opacity:.7}.catalog-source{font-size:.8rem;opacity:.6}.catalog-status{font-size:.84rem;opacity:.8;font-weight:600}.catalog-progress{height:7px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden}.catalog-progress span{display:block;height:100%;background:currentColor;border-radius:inherit}.catalog-btn{margin-top:auto;align-self:flex-start;text-decoration:none}.catalog-empty,.catalog-loading{grid-column:1/-1;padding:28px;border-radius:18px;background:rgba(255,255,255,.035);opacity:.8;text-align:center}.catalog-summary{margin-top:14px;opacity:.78}.catalog-head-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.catalog-head-actions .ghost-btn{display:inline-flex;align-items:center;justify-content:center}.catalog-tools input:focus,.catalog-tools select:focus{border-color:currentColor;box-shadow:0 0 0 3px rgba(255,255,255,.05)}.catalog-locked{opacity:.68}.catalog-lock{font-size:.84rem;font-weight:700}.catalog-btn[aria-disabled="true"]{opacity:.55;cursor:not-allowed}
</style>
</head>
<body class="content-page">
<header class="header"><nav class="nav container"><a href="../index.html" class="brand" aria-label="ئاڤاشین"><span class="brand-mark">ئا</span><span>ئاڤاشین</span></a><div class="nav-links"><a href="../learning.html">فێربوونی زمانی کوردی</a><a href="../linguistics.html">زمانەوانی کوردی</a><a href="../sabir-zhakaw.html">سابیر ژاکاو</a><a href="../index.html#books">کتێبەکان</a></div><div class="nav-actions"><a class="ghost-btn" href="../learning.html">گەڕانەوە</a></div></nav></header>
<main>
<section class="content-page-hero"><div class="container"><span class="eyebrow">بنکەی وانەکان</span><h1 id="courseTitle">وانەکان</h1><p id="courseMeta">بارکردنی ناوەڕۆک...</p><p id="overallProgress" class="catalog-summary"></p><div class="catalog-head-actions"><a class="ghost-btn" href="performance.html">ڕاپۆرتی ئەدا و پێشکەوتن</a><a class="ghost-btn" href="../learning.html">ڕێڕەوی فێربوون</a></div></div></section>
<section class="lesson-catalog"><div class="container"><div class="catalog-tools"><input id="catalogSearch" type="search" placeholder="گەڕان لە ناوی وانە..." aria-label="گەڕان لە وانەکان"><select id="sectionFilter" aria-label="هەڵبژاردنی بەش"><option value="all">هەموو بەشەکان</option></select></div><div id="catalog" class="catalog-grid"><div class="catalog-loading">وانەکان بار دەکرێن...</div></div></div></section>
</main><footer class="footer"><div class="container footer-bottom">© ٢٠٢٦ ئاڤاشین · فێربوونی زمانی کوردی</div></footer>
<script>
(async function(){const catalog=document.getElementById('catalog'),search=document.getElementById('catalogSearch'),filter=document.getElementById('sectionFilter'),overall=document.getElementById('overallProgress');let lessons=[],progression={enabled:false,requirePreviousCompletion:true};const escapeHtml=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));try{const res=await fetch('./index.json',{cache:'no-store'});if(!res.ok)throw Error('catalog');const data=await res.json(),course=data.course||{};progression={...progression,...(data.progression||{})};document.getElementById('courseTitle').textContent=course.title||'وانەکان';document.getElementById('courseMeta').textContent=course.author?`مامۆستا: ${course.author}`:'ڕێڕەوی فێربوونی زمانی کوردی';lessons=(data.sections||[]).flatMap(s=>(s.lessons||[]).map(l=>({...l,sectionTitle:s.title,sectionNumber:s.number,sectionId:s.id})));const sections=[...new Map(lessons.map(l=>[l.sectionId,l])).values()];sections.forEach(s=>{const o=document.createElement('option');o.value=s.sectionId;o.textContent=`بەشی ${s.sectionNumber} — ${s.sectionTitle}`;filter.appendChild(o)});render();}catch(e){catalog.innerHTML='<div class="catalog-empty">بارکردنی فهرستی وانەکان سەرکەوتوو نەبوو. تکایە دووبارە هەوڵ بدە.</div>';return}function isDone(l){return localStorage.getItem(`lesson-completed:${l.id}`)==='true'||localStorage.getItem(`lesson-progress:${l.id}`)==='completed'}function isLocked(index){if(!progression.enabled||!progression.requirePreviousCompletion||index<=0)return false;return !isDone(lessons[index-1])}function render(){const q=search.value.trim().toLocaleLowerCase(),selected=filter.value,filtered=lessons.map((l,index)=>({...l,_index:index})).filter(l=>(selected==='all'||l.sectionId===selected)&&(!q||`${l.title} ${l.number} ${l.sectionTitle}`.toLocaleLowerCase().includes(q)));const done=lessons.filter(isDone).length,passed=lessons.filter(l=>localStorage.getItem(`lesson-quiz:${l.id}`)==='passed').length;overall.textContent=`پێشکەوتن: ${done} لە ${lessons.length} وانە · تاقیکردنەوەی سەرکەوتوو: ${passed} · ${lessons.length?Math.round(done/lessons.length*100):0}%${progression.enabled?' · ڕێڕەوی پێشکەوتن چالاکە':''}`;if(!filtered.length){catalog.innerHTML='<div class="catalog-empty">هیچ وانەیەک بەم گەڕانە نەدۆزرایەوە.</div>';return}catalog.innerHTML=filtered.map(l=>{const d=isDone(l),qz=localStorage.getItem(`lesson-quiz:${l.id}`)==='passed',locked=isLocked(l._index),p=d?100:qz?85:0;return `<article class="catalog-card${locked?' catalog-locked':''}"><div class="catalog-meta"><span>وانەی ${escapeHtml(l.number)}</span><span>بەشی ${escapeHtml(l.sectionNumber)}</span></div><h2>${escapeHtml(l.title)}</h2><p>${escapeHtml(l.sectionTitle)}</p><div class="catalog-source">${l.bookLessonNumber?`ژمارەی کتێب: ${escapeHtml(l.bookLessonNumber)}`:'وانەی سیستەمی'}</div><div class="catalog-status">${locked?'<span class="catalog-lock">🔒 پێویستی بە تەواوکردنی وانەی پێشوو هەیە</span>':d?'✓ وانەکە تەواو کراوە':qz?'✓ تاقیکردنەوە سەرکەوتووە':'ئامادەی خوێندنەوە'}</div><div class="catalog-progress"><span style="width:${p}%"></span></div>${locked?`<span class="primary-btn big catalog-btn" aria-disabled="true">قفلە ←</span>`:`<a class="primary-btn big catalog-btn" href="../lesson.html?id=${encodeURIComponent(l.id)}">${d?'دووبارەکردنەوە':'دەستپێکردنی وانە'} ←</a>`}</article>`}).join('')}search.addEventListener('input',render);filter.addEventListener('change',render)})();
</script></body></html>
