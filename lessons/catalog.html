<!doctype html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>وانەکانی فۆنێتیک و فۆنۆلۆجی کوردیک | ئاڤاشین</title>
  <meta name="description" content="فهرستی ڕێکخراوی وانەکانی فۆنێتیک و فۆنۆلۆجی کوردیک.">
  <link rel="stylesheet" href="../style.css">
  <style>
    .lesson-catalog{padding:56px 0 80px}.catalog-head{margin-bottom:28px}.catalog-course{opacity:.75;margin-bottom:8px}.catalog-tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}.catalog-tools input,.catalog-tools select{background:#fff;border:1px solid #dfe7ea;border-radius:12px;padding:11px 14px;outline:0;font:inherit}.catalog-tools input{flex:1;min-width:240px}.catalog-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}.catalog-card{display:flex;flex-direction:column;gap:12px;padding:24px;border:1px solid #e3e9ec;border-radius:20px;background:#fff;transition:.2s}.catalog-card:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(24,49,61,.07)}.catalog-card h2{margin:0;font-size:1.25rem}.catalog-meta{display:flex;gap:10px;flex-wrap:wrap;font-size:.85rem;color:#78878e}.catalog-source{font-size:.8rem;color:#8a969b}.catalog-btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;margin-top:auto}.catalog-empty{grid-column:1/-1;padding:30px;border-radius:18px;background:#fff;border:1px solid #e3e9ec;color:#7b898f;text-align:center}.catalog-loading{text-align:center;padding:50px;opacity:.7}.catalog-progress{height:7px;background:#edf1f2;border-radius:99px;overflow:hidden}.catalog-progress span{display:block;height:100%;background:currentColor;border-radius:inherit}.catalog-status{font-size:.82rem;font-weight:600;opacity:.8}
  </style>
</head>
<body class="content-page">
<header class="header">
  <nav class="nav container">
    <a href="../index.html" class="brand" aria-label="ئاڤاشین"><span class="brand-mark">ئا</span><span>ئاڤاشین</span></a>
    <div class="nav-links">
      <a href="../learning.html">فێربوونی زمانی کوردی</a>
      <a href="../linguistics.html">زمانەوانی کوردی</a>
      <a href="../index.html">سەرەکی</a>
    </div>
    <div class="nav-actions"><a class="ghost-btn" href="../learning.html">گەڕانەوە</a></div>
  </nav>
</header>
<main>
<section class="content-page-hero"><div class="container"><span class="eyebrow">بنکەی وانەکان</span><h1 id="courseTitle">وانەکان</h1><p id="courseMeta">بارکردنی ناوەڕۆک...</p><p id="overallProgress"></p></div></section>
<section class="lesson-catalog"><div class="container">
  <div class="catalog-tools"><input id="catalogSearch" type="search" placeholder="گەڕان لە ناوی وانە..." aria-label="گەڕان لە وانەکان"><select id="sectionFilter" aria-label="هەڵبژاردنی بەش"><option value="all">هەموو بەشەکان</option></select></div>
  <div id="catalog" class="catalog-grid"><div class="catalog-loading">وانەکان بار دەکرێن...</div></div>
</div></section>
</main>
<footer class="footer"><div class="container footer-bottom">© ٢٠٢٦ ئاڤاشین · فێربوونی زمانی کوردی</div></footer>
<script>
(async function(){
  const catalog=document.getElementById('catalog'),search=document.getElementById('catalogSearch'),filter=document.getElementById('sectionFilter'),overall=document.getElementById('overallProgress');
  let lessons=[];
  const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  try{
    const res=await fetch('./index.json',{cache:'no-store'});if(!res.ok)throw new Error('catalog');
    const data=await res.json(),course=data.course||{};
    document.getElementById('courseTitle').textContent=course.title||'وانەکان';
    lessons=(data.sections||[]).flatMap(section=>(section.lessons||[]).map(lesson=>({...lesson,sectionTitle:section.title,sectionNumber:section.number,sectionId:section.id})));
    const doneCount=lessons.filter(l=>localStorage.getItem(`lesson-completed:${l.id}`)==='true').length;
    const passedCount=lessons.filter(l=>localStorage.getItem(`lesson-quiz:${l.id}`)==='passed').length;
    const percent=lessons.length?Math.round(doneCount/lessons.length*100):0;
    document.getElementById('courseMeta').textContent=(course.author?`نووسەر: ${course.author} · `:'')+`${lessons.length} وانە`;
    overall.textContent=`پێشکەوتن: ${doneCount} لە ${lessons.length} وانە · تاقیکردنەوەی سەرکەوتوو: ${passedCount} · ${percent}%`;
    const sections=[...new Map(lessons.map(l=>[l.sectionId,l])).values()];
    sections.forEach(s=>{const o=document.createElement('option');o.value=s.sectionId;o.textContent=`بەشی ${s.sectionNumber} — ${s.sectionTitle}`;filter.appendChild(o)});
    render();
  }catch(error){catalog.innerHTML='<div class="catalog-empty">بارکردنی فهرستی وانەکان سەرکەوتوو نەبوو. تکایە دووبارە هەوڵ بدە.</div>';return;}
  function render(){
    const q=search.value.trim().toLocaleLowerCase(),selected=filter.value;
    const filtered=lessons.filter(l=>(selected==='all'||l.sectionId===selected)&&(!q||`${l.title} ${l.number} ${l.bookLessonNumber||''} ${l.sectionTitle}`.toLocaleLowerCase().includes(q)));
    if(!filtered.length){catalog.innerHTML='<div class="catalog-empty">هیچ وانەیەک بەم گەڕانە نەدۆزرایەوە.</div>';return;}
    catalog.innerHTML=filtered.map(lesson=>{
      const done=localStorage.getItem(`lesson-completed:${lesson.id}`)==='true';
      const quiz=localStorage.getItem(`lesson-quiz:${lesson.id}`)==='passed';
      const percent=done?100:(quiz?85:0);
      return `<article class="catalog-card"><div class="catalog-meta"><span>وانەی ${escapeHtml(lesson.number)}</span><span>بەشی ${escapeHtml(lesson.sectionNumber)}</span></div><h2>${escapeHtml(lesson.title)}</h2><p>${escapeHtml(lesson.sectionTitle)}</p><div class="catalog-source">${lesson.bookLessonNumber?`ژمارەی کتێب: ${escapeHtml(lesson.bookLessonNumber)}`:'وانەی سیستەمی'}</div><div class="catalog-status">${done?'✓ وانەکە تەواو کراوە':quiz?'✓ تاقیکردنەوە سەرکەوتووە':'ئامادەی خوێندنەوە'}</div><div class="catalog-progress" aria-label="پێشکەوتنی وانە"><span style="width:${percent}%"></span></div><a class="primary-btn big catalog-btn" href="../lesson.html?id=${encodeURIComponent(lesson.id)}">${done?'دووبارەکردنەوە':'دەستپێکردنی وانە'} ←</a></article>`;
    }).join('');
  }
  search.addEventListener('input',render);filter.addEventListener('change',render);
})();
</script>
</body>
</html>
