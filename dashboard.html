<!doctype html>
<html lang="ckb" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پەنێڵی خوێندکار | زانستی کورد</title><link rel="stylesheet" href="style.css"><style>
.student-shell{min-height:100vh;background:#f5f7f6}.student-top{background:#202824;color:#fff;padding:22px 0}.student-top .container{display:flex;align-items:center;justify-content:space-between;gap:18px}.student-brand{font-weight:800}.logout{border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;border-radius:9px;padding:9px 15px;cursor:pointer}.student-main{padding:42px 0}.welcome{margin-bottom:28px}.welcome .eyebrow{color:#2e8d81}.welcome h1{margin-top:7px;font-size:clamp(26px,4vw,40px);color:#26372f}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#fff;border:1px solid #dce4e1;border-radius:15px;padding:24px;box-shadow:0 10px 28px rgba(27,42,35,.05)}.card h2{font-size:17px;color:#26372f;margin-bottom:9px}.card p{color:#68756f;font-size:13px}.course-card{grid-column:span 2}.course-title{font-size:20px!important}.progress{height:9px;background:#e7ecea;border-radius:20px;overflow:hidden;margin:16px 0 9px}.progress span{display:block;height:100%;width:0;background:#63b8aa}.course-actions{display:flex;gap:10px;margin-top:17px;flex-wrap:wrap}.course-actions a,.course-actions button{padding:10px 15px;border-radius:9px;border:1px solid #ccd8d3;background:#fff;font-weight:800;color:#29473d;cursor:pointer}.course-actions .primary{background:#29473d;color:#fff}@media(max-width:800px){.grid{grid-template-columns:1fr}.course-card{grid-column:span 1}}
</style></head>
<body class="student-shell"><header class="student-top"><div class="container"><div class="student-brand">زانستی کورد · پەنێڵی خوێندکار</div><button id="logout" class="logout">چوونەدەرەوە</button></div></header><main class="student-main container"><div class="welcome"><div class="eyebrow"><span></span> Student Dashboard</div><h1 id="welcome">پەنێڵی خوێندکار</h1></div><section class="grid"><article class="card"><h2>پڕۆفایل</h2><p id="email">...</p></article><article class="card"><h2>دۆخی هەژمار</h2><p id="status">پشکنین...</p></article><article class="card"><h2>کۆرسە چالاکەکان</h2><p id="courseCount">0</p></article><article class="card course-card"><h2 class="course-title">کۆرسی ئەکادێمیک و زانستی فۆنێتیک و فۆنۆلۆجی زوانی کوردیک</h2><p>ڕێڕەوی فێربوون و پێشکەوتنی خوێندکار لەم شوێنە بەڕێوەدەبرێت.</p><div class="progress"><span id="progressBar"></span></div><p id="progressText">0% ـی ڕێڕەو تەواو کراوە</p><div class="course-actions"><a class="primary" href="course-2.html">بینینی کۆرس</a><a href="learning.html">ڕێڕەوی فێربوون</a></div></article></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=20261007-auth"></script><script>
if(!window.ZANSTI_SUPABASE?.ready) document.getElementById('status').textContent='backend هێشتا چالاک نەکراوە.';
else{const sb=supabase.createClient(ZANSTI_SUPABASE.url,ZANSTI_SUPABASE.publishableKey);(async()=>{const {data:{session}}=await sb.auth.getSession();if(!session){location.replace('auth.html');return}document.getElementById('email').textContent=session.user.email||'—';document.getElementById('welcome').textContent='بەخێربێیت، '+(session.user.user_metadata?.full_name||'خوێندکار');document.getElementById('status').textContent='هەژمارەکە چالاکە';document.getElementById('courseCount').textContent='١';})();document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();location.href='auth.html'}}
</script></body></html>
